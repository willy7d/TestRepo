<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lexia · Camminata</title>
<style>
:root{color-scheme:light;font:16px system-ui,-apple-system,sans-serif;background:#f6f2f8;color:#23172b;--size:170px}
@media(max-width:600px){:root{--size:128px}}
body{margin:0;min-height:100vh;background:#f6f2f8}
main{margin:clamp(2rem,10vh,7rem) auto 0;width:min(84%,48rem);padding-bottom:calc(var(--size) + 90px)}
h1{font-size:clamp(3rem,9vw,7rem);line-height:1;margin:0;letter-spacing:-.07em}
p{line-height:1.6;color:#514257}
button{font:inherit;border:0;border-radius:999px;padding:.72rem 1rem;background:#43234c;color:#fff;cursor:pointer}
.lexia-track{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));height:calc(var(--size) + 70px);pointer-events:none;overflow:hidden;z-index:50}
.lexia-track canvas{position:absolute;left:0;bottom:0;width:100%;height:100%}
.lexia-bubble{position:absolute;bottom:0;left:0;width:max-content;padding:.45rem .75rem;border-radius:.8rem;background:#fff;color:#43234c;box-shadow:0 3px 14px #43234c30;font-size:.88rem;font-weight:600;opacity:0;transform:translate(-50%,6px);transition:opacity .25s,transform .25s;white-space:nowrap}
.lexia-bubble.show{opacity:1;transform:translate(-50%,0)}
.lexia-bubble::after{content:"";position:absolute;top:100%;left:calc(50% - 6px + var(--arrow,0px));border:6px solid transparent;border-top-color:#fff}
</style>
</head>
<body>
<main>
<h1>Lexia</h1>
<p>Simulazione della camminata lungo il bordo inferiore della pagina: rig 2D guidato da curve di camminata normative (anca, ginocchio, caviglia), piedi vincolati al pavimento e rollio tallone → pianta → punta.</p>
<button type="button" id="toggle">Pausa</button>
</main>
<div class="lexia-track" aria-hidden="true"><canvas></canvas><div class="lexia-bubble">Se hai bisogno, dimmi!</div></div>
<script>
const RIG = /*RIG*/null;
(() => {
const track = document.querySelector('.lexia-track');
const canvas = track.querySelector('canvas');
let ctx = canvas.getContext('2d');
const bubble = track.querySelector('.lexia-bubble');
const toggle = document.getElementById('toggle');
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const D = Math.PI / 180;

// ---------- rig geometry (source pixels of the side drawing) ----------
const L1 = 110.5, L2 = 114.9;               // thigh, shin
const U1 = 90.6, U2 = 53.5;                 // upper arm, forearm
const BONE0 = {thigh: 80.62*D, shin: 97.0*D, upperArm: 112.0*D, foreArm: 110.8*D};
const ANK_H = 33.5;                         // ankle height over flat sole
const HEELX = -17, BALLX = 37, TOEX = 53;   // sole contact points (x from ankle)
const SOLE = [[-19, ANK_H], [BALLX, ANK_H], [56, ANK_H - 1.5]];
const SHOULDER = [-30, -110];               // shoulder from body pivot
const BODY_OFF = [/*BX*/11, /*BY*/0];        // body pivot relative to hip joint
const HEAD_H = 229;                         // head top above hip

// ---------- normative sagittal gait curves, every 5 % of the cycle (0 % = heel strike) ----------
// thigh angle to vertical, knee flexion, ankle dorsiflexion (deg) – adult level walking, natural cadence
// (shape and timing after Winter 1991 / Perry 1992)
const TH = [22, 21, 18, 13, 8, 3, -2, -7, -12, -16, -19, -17, -10, 0, 10, 18, 23, 25, 25, 23];
const KN = [5, 12, 18, 20, 18, 14, 10, 7, 5, 7, 13, 25, 40, 55, 63, 62, 52, 36, 18, 6];
const AN = [0, -5, -4, 0, 3, 5, 7, 8, 10, 10, 7, -5, -17, -19, -12, -5, 0, 2, 2, 1];
function curve(tb, p){                      // periodic Catmull-Rom
  const n = tb.length, f = (((p % 1) + 1) % 1)*n, i = Math.floor(f), t = f - i;
  const a = tb[(i+n-1)%n], b = tb[i%n], c = tb[(i+1)%n], d = tb[(i+2)%n];
  return 0.5*(2*b + (c-a)*t + (2*a-5*b+4*c-d)*t*t + (3*b-a-3*c+d)*t*t*t);
}
const S = /*S*/385;                         // stride (one full cycle) in rig units
const CYCLE = 1.15;                         // seconds per cycle at full speed
const V = S / CYCLE;
const FF = 0.10, HO = 0.36, TO = 0.62;      // foot flat, heel off, toe off (fractions of cycle)
const C = /*C*/86;                          // flat-foot ankle x (cycle frame, hip at p*S)
const G_HS = 17*D, G_TO = -58*D;            // foot-to-floor angle at heel strike / toe off
const KMIN = 4*D;                           // never fully lock the knee (avoids IK snapping)
const reach = k => Math.sqrt(L1*L1 + L2*L2 + 2*L1*L2*Math.cos(k));
const DMAX = reach(KMIN);

const rot = (v, a) => [v[0]*Math.cos(a) - v[1]*Math.sin(a), v[0]*Math.sin(a) + v[1]*Math.cos(a)];
const smooth = t => t*t*(3 - 2*t);
const clamp01 = t => Math.max(0, Math.min(1, t));
const lerp = (a, b, t) => a + (b - a)*t;
// pitch > 0 = toe up. Screen y grows downward, ground at y = 0.
// stance foot rolls over the ground without slipping: heel rocker, flat, forefoot rocker
function contactFoot(xc, pitch){ const r = rot([xc, ANK_H], -pitch); return {ank: [C + xc - r[0], -r[1]], pitch}; }
function stance(p){
  if (p < FF) return contactFoot(HEELX, G_HS*Math.pow(1 - p/FF, 1.6));
  if (p < HO) return {ank: [C, -ANK_H], pitch: 0};
  const pitch = G_TO*Math.pow((p - HO)/(TO - HO), 1.5);
  return contactFoot(lerp(BALLX, TOEX, smooth(clamp01(-pitch/(35*D)))), pitch);
}
// pelvis height over the cycle: chosen so that the stance knee follows the normative curve
const N = 240, HT = new Float32Array(N), CAP = new Float32Array(N), HS = new Float32Array(N);
for (let i = 0; i < N; i++){
  const ph = i/N; let num = 0, den = 0, cap = Infinity;
  for (const p of [ph, (ph + 0.5) % 1]){
    if (p >= TO) continue;
    const st = stance(p), dx = st.ank[0] - S*p, d = reach(Math.max(KMIN, curve(KN, p)*D));
    const w = Math.pow(Math.sin(Math.PI*p/TO), 2) + 1e-3;
    num += w*(-st.ank[1] + Math.sqrt(Math.max(1, d*d - dx*dx))); den += w;
    cap = Math.min(cap, -st.ank[1] + Math.sqrt(Math.max(1, DMAX*DMAX - dx*dx)));
  }
  CAP[i] = cap; HT[i] = Math.min(num/den, cap);
}
for (let i = 0; i < N; i++){ let a = 0, w = 0; for (let k = -12; k <= 12; k++){ const g = Math.exp(-k*k/32); a += g*HT[(i+k+N)%N]; w += g; } HS[i] = Math.min(a/w, CAP[i]); }
const hipH = ph => { const f = (((ph % 1) + 1) % 1)*N, i = Math.floor(f), t = f - i; return HS[i%N]*(1-t) + HS[(i+1)%N]*t; };
// swing: forward kinematics of the normative angles from the hip, blended onto the toe-off / heel-strike contacts
function fk(p){
  const th = curve(TH, p)*D, sh = th - curve(KN, p)*D;
  return {ank: [S*p + L1*Math.sin(th) + L2*Math.sin(sh), -hipH(p) + L1*Math.cos(th) + L2*Math.cos(sh)], pitch: sh + curve(AN, p)*D};
}
const ST_TO = stance(TO - 1e-6), ST_HS = stance(0), FK_TO = fk(TO), FK_HS = fk(1 - 1e-6);
const D0 = [ST_TO.ank[0] - FK_TO.ank[0], ST_TO.ank[1] - FK_TO.ank[1], ST_TO.pitch - FK_TO.pitch];
const D1 = [ST_HS.ank[0] + S - FK_HS.ank[0], ST_HS.ank[1] - FK_HS.ank[1], ST_HS.pitch - FK_HS.pitch];
function liftClear(ank, pitch, margin){
  for (const pt of SOLE){ const w = rot(pt, -pitch); if (ank[1] + w[1] > -margin) ank[1] = -margin - w[1]; }
}
// foot pose in the cycle frame where the hip is at x = p*S
function foot(p){
  if (p < TO) return stance(p);
  const f = fk(p), s = (p - TO)/(1 - TO), m = smooth(s);
  const ank = [f.ank[0] + lerp(D0[0], D1[0], m), f.ank[1] + lerp(D0[1], D1[1], m)], pitch = f.pitch + lerp(D0[2], D1[2], m);
  liftClear(ank, pitch, 3*Math.sin(Math.PI*s));
  return {ank, pitch};
}
function legRel(p){ p = ((p % 1) + 1) % 1; const f = foot(p); return {dx: f.ank[0] - p*S, y: f.ank[1], pitch: f.pitch}; }

function ik(hip, ank){
  let dx = ank[0]-hip[0], dy = ank[1]-hip[1], d = Math.hypot(dx, dy);
  d = Math.min(d, L1+L2-0.01);
  const al = Math.atan2(dy, dx);
  const b = Math.acos(Math.max(-1, Math.min(1, (L1*L1 + d*d - L2*L2)/(2*L1*d))));
  const ta = al - b;                       // knee points forward (+x)
  const knee = [hip[0] + L1*Math.cos(ta), hip[1] + L1*Math.sin(ta)];
  return {ta, sa: Math.atan2(ank[1]-knee[1], ank[0]-knee[0]), knee};
}

// standing pose (feet together) used for the stop: the near foot is already flat on the ground at phase P_STOP
const STAND_NEAR = -10, STAND_FAR = 4;      // ankle x relative to hip
const P_STOP = (C - STAND_NEAR)/S;          // phase at which the near foot sits under the hip
const P_CLOSE = FF + 0.02;                  // far foot toes off here -> closing step
const H_STAND = ANK_H + Math.sqrt(reach(5*D)**2 - STAND_NEAR*STAND_NEAR);
const STAND_H = H_STAND + HEAD_H;           // head-to-sole when standing

// ---------- images ----------
const img = {}, dark = {};
let pending = 0;
function load(name){
  pending++;
  const im = new Image();
  im.onload = () => {
    img[name] = im;
    if (name !== 'front' && name !== 'body'){
      const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
      const x = c.getContext('2d'); x.drawImage(im, 0, 0);
      x.globalCompositeOperation = 'source-atop'; x.fillStyle = 'rgba(20,6,24,.30)'; x.fillRect(0, 0, c.width, c.height);
      dark[name] = c;
    }
    if (--pending === 0) start();
  };
  im.src = RIG[name].src;
}
function part(set, name, at, ang){
  const r = RIG[name];
  ctx.save(); ctx.translate(at[0], at[1]); ctx.rotate(ang);
  ctx.drawImage(set[name], -r.px, -r.py); ctx.restore();
}

// ---------- pose (rig units, ground y = 0, hip x = 0) ----------
// phase: gait phase of the near leg; w: 0 = walking … 1 = standing; farStand: x of the far foot's standing spot
function pose(phase, w, farStand){
  const pN = ((phase % 1) + 1) % 1, pF = (pN + 0.5) % 1;
  const h = lerp(hipH(phase), H_STAND, w);
  const near = legRel(pN), far = legRel(pF);
  if (w > 0){
    const air = Math.sin(Math.PI*w);
    far.dx = lerp(far.dx, farStand, w); far.y = lerp(far.y, -ANK_H, w) - 7*air; far.pitch = lerp(far.pitch, 0, w) - 8*D*air;
    const a = [far.dx, far.y]; liftClear(a, far.pitch, 0); far.y = a[1];
  }
  const g = 1 - w;
  const lean = /*LEAN*/7.5*D*g + 0.7*D*g*Math.cos(4*Math.PI*(phase - 0.05));   // forward trunk lean while walking
  const fwd = /*FWD*/9*g;                                      // trunk carried ahead of the hips while walking
  const twist = 3*g;                                         // pelvis / shoulder counter-rotation seen from the side
  const arm = p => {                                         // near arm is furthest back at its own heel strike
    const c = Math.cos(2*Math.PI*(p - 0.04));
    const sh = lerp(-2, -6 - 17*c, g), el = lerp(8, 30 - 14*Math.cos(2*Math.PI*(p - 0.10)), g);
    return {ua: (90 - sh)*D, fa: (90 - sh - el)*D, off: -1.3*twist*Math.cos(2*Math.PI*p)};
  };
  return {h, lean, fwd, near, far, hipN: twist*Math.cos(2*Math.PI*pN), hipF: twist*Math.cos(2*Math.PI*pF), armN: arm(pN), armF: arm(pF)};
}
function drawSide(phase, w = 0, farStand = STAND_FAR){
  const P = pose(phase, w, farStand), hip = [0, -P.h];
  const bodyAt = [hip[0] + BODY_OFF[0] + P.fwd, hip[1] + BODY_OFF[1]];
  const leg = (l, set, off) => {
    const hp = [hip[0]+off[0], hip[1]+off[1]], ank = [l.dx, l.y], k = ik(hp, ank);
    part(set, 'boot', ank, -l.pitch);
    part(set, 'shin', k.knee, k.sa - BONE0.shin);
    part(set, 'thigh', hp, k.ta - BONE0.thigh);
    return k;
  };
  const arm = (a, set, off) => {
    const sh0 = rot(SHOULDER, P.lean);
    const sh = [bodyAt[0]+sh0[0]+off[0]+a.off, bodyAt[1]+sh0[1]+off[1]];
    const el = [sh[0] + U1*Math.cos(a.ua), sh[1] + U1*Math.sin(a.ua)];
    part(set, 'upperArm', sh, a.ua - BONE0.upperArm);
    part(set, 'foreArm', el, a.fa - BONE0.foreArm);
  };
  arm(P.armF, dark, [14, 2]);
  const kF = leg(P.far, dark, [P.hipF - 4, -2]);
  const kN = leg(P.near, img, [P.hipN, 0]);
  part(img, 'body', bodyAt, P.lean);
  arm(P.armN, img, [0, 0]);
  return {P, kN, kF};
}
function drawFront(){
  const f = RIG.front, h = STAND_H, w = f.w*h/f.h;
  ctx.drawImage(img.front, -w/2 + /*FX*/-6, -h, w, h);
}

// offscreen snapshots of the two standing views, redrawn in vertical slices on a rotating cylinder
const BX0 = 112, BTOP = 14, R_CYL = 92, SLICE = 3;
const bufs = [document.createElement('canvas'), document.createElement('canvas')];
function snapshot(i, fn){
  const q = dpr*K, b = bufs[i], w = Math.ceil(2*BX0*q), h = Math.ceil((STAND_H + BTOP + 8)*q);
  if (b.width !== w || b.height !== h){ b.width = w; b.height = h; }
  const main = ctx; ctx = b.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0, 0, w, h);
  ctx.setTransform(q, 0, 0, q, BX0*q, (STAND_H + BTOP)*q); fn(); ctx = main;
}
const warpBuf = document.createElement('canvas');
function wrapped(i, turn, alpha){
  if (alpha <= 0.001) return;
  const q = dpr*K, b = bufs[i], HP = Math.PI/2;
  const f = x => R_CYL*Math.sin(Math.max(-HP, Math.min(HP, turn(Math.asin(Math.max(-1, Math.min(1, x/R_CYL)))))));
  const c0 = f(0);                                           // keep the body axis in place: she turns on the spot
  // warp at full opacity into a buffer first, so slice seams never show through when fading
  if (warpBuf.width !== b.width || warpBuf.height !== b.height){ warpBuf.width = b.width; warpBuf.height = b.height; }
  const w2 = warpBuf.getContext('2d'); w2.clearRect(0, 0, b.width, b.height);
  for (let x = -BX0; x < BX0; x += SLICE){
    const a = f(x), w = f(x + SLICE) - a;
    if (w > 0.02) w2.drawImage(b, (x + BX0)*q, 0, SLICE*q, b.height, (a - c0 + BX0)*q, 0, w*q + 0.6, b.height);
  }
  ctx.globalAlpha = alpha;
  ctx.drawImage(warpBuf, -BX0, -(STAND_H + BTOP), b.width/q, b.height/q);
  ctx.globalAlpha = 1;
}

// ---------- timeline ----------
let W = 0, Hc = 0, dpr = 1, K = 0.34;
function resize(){
  dpr = Math.min(3, window.devicePixelRatio || 1);
  W = track.clientWidth; Hc = track.clientHeight;
  canvas.width = Math.round(W*dpr); canvas.height = Math.round(Hc*dpr);
  const size = parseFloat(getComputedStyle(track).height) - 70;
  K = size / STAND_H;
}
const T_SETTLE = 0.25, T_TURN = 0.6, T_HOLD = 3.0, T_OFF = 1.6;
let plan;
function makePlan(){
  const enter = -150/K, exit = W/K + 150/K;
  const target = (W - Math.max(70, 0.36*STAND_H*K) - 16) / K;
  const stopS = S*(Math.round(target/S - P_STOP) + P_STOP);
  const dDec = 0.5*S, dAcc = 0.4*S;
  const tWalk1 = (stopS - dDec - enter)/V, tDec = 2*dDec/V;
  const tAcc = 2*dAcc/V, tWalk2 = (exit - stopS - dAcc)/V;
  const ts = [tWalk1, tDec, T_SETTLE, T_TURN, T_HOLD, T_TURN, T_SETTLE, tAcc, tWalk2, T_OFF];
  return {enter, exit, stopS, dDec, dAcc, ts, total: ts.reduce((a,b)=>a+b, 0)};
}
// stand-blend from the gait phase: closing step when stopping, first step when leaving
function standW(s, leaving){
  const p = (s - plan.stopS)/S + P_STOP;                     // near-leg phase, continuous around the stop
  if (!leaving) return clamp01((p - P_CLOSE)/(P_STOP - P_CLOSE));
  return 1 - smooth(clamp01((p - P_STOP - 0.02)/0.2));
}
// returns {s, w, mix}: s = hip x (rig units), w = stand blend, mix 0 side -> 1 front
function stateAt(t){
  const P = plan, [a,b,c,d,e,f,g,h,i] = P.ts;
  t = ((t % P.total) + P.total) % P.total;
  if (t < a) return {s: P.enter + V*t, w: 0, mix: 0};
  t -= a; if (t < b){ const u = t/b, s = P.stopS - P.dDec*(1-u)*(1-u); return {s, w: standW(s, false), mix: 0}; }
  t -= b; if (t < c) return {s: P.stopS, w: 1, mix: 0};
  t -= c; if (t < d) return {s: P.stopS, w: 1, mix: smooth(t/d)};
  t -= d; if (t < e) return {s: P.stopS, w: 1, mix: 1, bubble: true};
  t -= e; if (t < f) return {s: P.stopS, w: 1, mix: 1 - smooth(t/f)};
  t -= f; if (t < g) return {s: P.stopS, w: 1, mix: 0};
  t -= g; if (t < h){ const u = t/h, s = P.stopS + P.dAcc*u*u; return {s, w: standW(s, true), mix: 0}; }
  t -= h; if (t < i) return {s: P.stopS + P.dAcc + V*t, w: 0, mix: 0};
  return {s: P.exit, mix: 0, off: true};
}
function render(st){
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (st.off){ bubble.classList.remove('show'); return; }
  const x = st.s*K, base = Hc - 4;
  const draw = (fn, alpha, sx) => {
    if (alpha <= 0.001) return;
    ctx.setTransform(dpr*K*sx, 0, 0, dpr*K, x*dpr, base*dpr);
    ctx.globalAlpha = alpha; fn(); ctx.globalAlpha = 1;
  };
  const m = st.mix;
  // turn towards the viewer: both views are wrapped on a cylinder that rotates by 90° (volume, not a flat card)
  if (m <= 0) draw(() => drawSide(st.s/S, st.w, plan.stopS + STAND_FAR - st.s), 1, 1);
  else if (m >= 1) draw(drawFront, 1, 1);
  else {
    const th = 90*D*m, deg = th/D;
    snapshot(0, () => drawSide(st.s/S, 1, STAND_FAR)); snapshot(1, drawFront);
    ctx.setTransform(dpr*K, 0, 0, dpr*K, x*dpr, base*dpr);
    wrapped(0, phi => phi - th, deg < 45 ? 1 : clamp01((53 - deg)/8));
    wrapped(1, phi => phi + Math.PI/2 - th, clamp01((deg - 37)/8));
  }
  const bw = bubble.offsetWidth, cx = x - 4*K;
  const bx = Math.max(bw/2 + 8, Math.min(W - bw/2 - 8, cx));
  bubble.style.left = bx + 'px';
  bubble.style.setProperty('--arrow', Math.max(-bw/2 + 14, Math.min(bw/2 - 14, cx - bx)) + 'px');
  bubble.style.bottom = (STAND_H*K + 14) + 'px';
  bubble.classList.toggle('show', !!st.bubble);
}

let running = true, t = 0, prev, raf;
function frame(now){
  if (prev !== undefined) t += Math.min(0.05, (now - prev)/1000);
  prev = now; render(stateAt(t));
  if (running) raf = requestAnimationFrame(frame);
}
function staticPose(){
  const P = plan; render({s: Math.min(P.stopS, W/K - 120/K), w: 1, mix: 1, bubble: true});
}
function start(){
  resize(); plan = makePlan();
  addEventListener('resize', () => { resize(); plan = makePlan(); if (!running || reduce.matches) staticPose(); });
  reduce.addEventListener?.('change', () => { location.reload(); });
  if (reduce.matches){ running = false; staticPose(); toggle.hidden = true; return; }
  raf = requestAnimationFrame(frame);
  toggle.addEventListener('click', () => {
    running = !running; prev = undefined; toggle.textContent = running ? 'Pausa' : 'Avvia';
    cancelAnimationFrame(raf); if (running) raf = requestAnimationFrame(frame);
  });
}
// hooks for offline preview rendering
window.__lexia = {seek(sec){ running = false; cancelAnimationFrame(raf); t = sec; render(stateAt(t)); }, get plan(){ return plan; }, drawSide, stateAt, hipH, legRel, ik, pose, curve, TH, KN, AN, S, C, D0, D1, P_STOP, H_STAND, L1, L2};
for (const n of Object.keys(RIG)) load(n);
})();
</script>
</body>
</html>
